<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header>
      <h1>X Broadcaster</h1>
      <span id="statusBadge" class="badge idle">Idle</span>
    </header>

    <section class="stats">
      <div class="stat-row">
        <span class="stat-label">Today</span>
        <span id="sentToday" class="stat-value">0</span>
        <span class="stat-sep">/</span>
        <span id="dailyLimit" class="stat-value">200</span>
      </div>
      <div id="currentAction" class="current-action hidden">
        <span class="spinner"></span>
        <span id="actionText"></span>
      </div>
    </section>

    <!-- Direct Send Mode -->
    <section id="directSend" class="direct-send">
      <p style="font-size:10px;color:#8b98a5;margin-bottom:4px">Open X Messages page first, then click Send</p>
      <textarea id="directHandles" placeholder="@user1&#10;@user2&#10;@user3..." rows="3"></textarea>
      <div class="controls" style="margin-top:6px">
        <button id="btnDirectStart" class="btn primary" style="flex:1">▶ Direct Send</button>
        <button id="btnDirectStop" class="btn danger" style="flex:0.5" disabled>⏹</button>
      </div>
    </section>

    <div class="divider"><span>or search & send</span></div>

    <section class="controls">
      <button id="btnStart" class="btn primary" style="flex:0.5">▶ Search</button>
      <button id="btnPause" class="btn secondary" style="flex:0.5" disabled>⏸ Pause</button>
      <button id="btnStop" class="btn danger" style="flex:0.5" disabled>⏹ Stop</button>
    </section>

    <footer>
      <a href="#" id="openDashboard">Open Dashboard →</a>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
