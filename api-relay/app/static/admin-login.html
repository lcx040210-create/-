<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Relay - 管理员登录</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #11111b; color: #cdd6f4; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .card { background: #1e1e2e; border-radius: 12px; padding: 40px; width: 400px; }
  h1 { text-align: center; color: #f9e2af; margin-bottom: 8px; }
  .sub { text-align: center; color: #6c7086; font-size: 14px; margin-bottom: 24px; }
  input { width: 100%; padding: 10px 14px; margin-bottom: 12px; background: #11111b; border: 1px solid #313244; border-radius: 8px; color: #cdd6f4; font-size: 14px; }
  button { width: 100%; padding: 12px; background: #f9e2af; color: #11111b; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:hover { background: #f5d88a; }
  .error { color: #f38ba8; font-size: 13px; margin-bottom: 12px; display: none; }
  .link { text-align: center; margin-top: 16px; font-size: 13px; color: #6c7086; }
  .link a { color: #89b4fa; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <h1>AI Relay</h1>
  <p class="sub">管理员登录</p>
  <div class="error" id="error"></div>
  <input type="email" id="email" placeholder="管理员邮箱" onkeydown="if(event.key==='Enter')login()">
  <input type="password" id="password" placeholder="密码" onkeydown="if(event.key==='Enter')login()">
  <button onclick="login()">登 录</button>
  <p class="link"><a href="/static/login.html">← 返回用户登录</a></p>
</div>
<script>
async function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const res = await fetch('/admin/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({email, password}) });
  if (res.ok) { window.location.href = '/static/admin.html'; }
  else { const d = await res.json(); document.getElementById('error').textContent = d.detail; document.getElementById('error').style.display = 'block'; }
}
</script>
</body>
</html>
