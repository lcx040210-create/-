<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Relay - 登录</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #11111b; color: #cdd6f4; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .card { background: #1e1e2e; border-radius: 12px; padding: 40px; width: 400px; }
  h1 { text-align: center; color: #89b4fa; margin-bottom: 8px; }
  .sub { text-align: center; color: #6c7086; font-size: 14px; margin-bottom: 24px; }
  input { width: 100%; padding: 10px 14px; margin-bottom: 12px; background: #11111b; border: 1px solid #313244; border-radius: 8px; color: #cdd6f4; font-size: 14px; }
  button { width: 100%; padding: 12px; background: #89b4fa; color: #11111b; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:hover { background: #b4d0fb; }
  .link { text-align: center; margin-top: 16px; font-size: 13px; color: #6c7086; }
  .link a { color: #89b4fa; cursor: pointer; text-decoration: none; }
  .error { color: #f38ba8; font-size: 13px; margin-bottom: 12px; display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>AI Relay</h1>
  <p class="sub">API 中转服务平台</p>
  <div class="error" id="error"></div>
  <div id="registerFields" style="display:none;">
    <input type="email" id="email" placeholder="邮箱">
    <input type="password" id="password" placeholder="密码（至少6位）">
    <button onclick="register()">注 册</button>
    <p class="link">已有账号？<a onclick="toggleMode()">立即登录</a></p>
  </div>
  <div id="loginFields">
    <input type="email" id="email2" placeholder="邮箱">
    <input type="password" id="password2" placeholder="密码">
    <button onclick="login()">登 录</button>
    <p class="link">没有账号？<a onclick="toggleMode()">立即注册</a></p>
  </div>
</div>
<script>
let isRegister = false;
function toggleMode() {
  isRegister = !isRegister;
  document.getElementById('registerFields').style.display = isRegister ? 'block' : 'none';
  document.getElementById('loginFields').style.display = isRegister ? 'none' : 'block';
  document.getElementById('error').style.display = 'none';
}
async function login() {
  const email = document.getElementById('email2').value;
  const password = document.getElementById('password2').value;
  const res = await fetch('/api/auth/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({email, password}) });
  if (res.ok) { window.location.href = '/static/dashboard.html'; }
  else { const d = await res.json(); document.getElementById('error').textContent = d.detail; document.getElementById('error').style.display = 'block'; }
}
async function register() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const res = await fetch('/api/auth/register', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({email, password}) });
  if (res.ok) { window.location.href = '/static/dashboard.html'; }
  else { const d = await res.json(); document.getElementById('error').textContent = d.detail; document.getElementById('error').style.display = 'block'; }
}
</script>
</body>
</html>
