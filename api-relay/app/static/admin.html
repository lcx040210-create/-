<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Relay - 管理后台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #11111b; color: #cdd6f4; min-height: 100vh; }
  nav { background: #1e1e2e; padding: 0 24px; height: 56px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #313244; position: sticky; top: 0; z-index: 10; }
  nav span.logo { font-weight: bold; color: #f9e2af; margin-right: 24px; }
  nav a { color: #6c7086; text-decoration: none; font-size: 13px; padding: 8px 14px; border-radius: 6px; cursor: pointer; transition: .15s; }
  nav a:hover { background: #313244; }
  nav a.active { color: #f9e2af; background: #313244; }
  .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat { background: #1e1e2e; border-radius: 10px; padding: 20px; }
  .stat .label { font-size: 12px; color: #6c7086; margin-bottom: 6px; }
  .stat .value { font-size: 28px; font-weight: bold; color: #89b4fa; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #1e1e2e; }
  th { color: #6c7086; border-bottom-color: #313244; font-weight: 500; position: sticky; top: 56px; background: #11111b; }
  tr:hover td { background: #1e1e2e22; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .tag-active { background: #a6e3a1; color: #11111b; }
  .tag-banned { background: #f38ba8; color: #11111b; }
  .tag-openai { background: #89b4fa; color: #11111b; }
  .tag-anthropic { background: #cba6f7; color: #11111b; }
  button { padding: 6px 14px; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: .15s; }
  .btn-primary { background: #89b4fa; color: #11111b; }
  .btn-primary:hover { background: #b4d0fb; }
  .btn-warn { background: #f9e2af; color: #11111b; }
  .btn-warn:hover { background: #f5d88a; }
  .btn-danger { background: #f38ba8; color: #11111b; }
  .btn-danger:hover { background: #eba0ac; }
  .btn-sm { padding: 4px 10px; font-size: 11px; margin-right: 4px; }
  input, select { padding: 8px 12px; background: #11111b; border: 1px solid #313244; border-radius: 6px; color: #cdd6f4; font-size: 13px; }
  input:focus { outline: none; border-color: #89b4fa; }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 100; justify-content: center; align-items: center; }
  .modal.show { display: flex; }
  .modal-box { background: #1e1e2e; border-radius: 12px; padding: 28px; width: 440px; max-width: 90vw; }
  .modal-box h3 { margin-bottom: 16px; color: #89b4fa; }
  .modal-box input { width: 100%; margin-bottom: 10px; }
  .modal-box .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .hint { font-size: 11px; color: #6c7086; margin-top: 2px; }
  .empty { text-align: center; color: #6c7086; padding: 40px; }
  .toast { position: fixed; top: 20px; right: 20px; background: #a6e3a1; color: #11111b; padding: 12px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; z-index: 200; opacity: 0; transform: translateY(-10px); transition: .25s; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.err { background: #f38ba8; }
</style>
</head>
<body>
<nav>
  <span class="logo">⚡ AI Relay</span>
  <a class="active" data-tab="overview" onclick="switchTab('overview')">概览</a>
  <a data-tab="users" onclick="switchTab('users')">用户</a>
  <a data-tab="routes" onclick="switchTab('routes')">路由</a>
  <a data-tab="pricing" onclick="switchTab('pricing')">定价</a>
  <a href="#" onclick="logout()" style="margin-left:auto;">退出</a>
</nav>

<div id="tab-overview" class="container">
  <div class="cards" id="statsCards"></div>
</div>

<div id="tab-users" class="container" style="display:none;">
  <table><thead><tr><th>ID</th><th>邮箱</th><th>余额</th><th>状态</th><th>注册时间</th><th>操作</th></tr></thead><tbody id="usersTbody"></tbody></table>
</div>

<div id="tab-routes" class="container" style="display:none;">
  <table><thead><tr><th>别名</th><th>上游供应商</th><th>上游模型</th><th>格式</th><th>状态</th><th>操作</th></tr></thead><tbody id="routesTbody"></tbody></table>
</div>

<div id="tab-pricing" class="container" style="display:none;">
  <table><thead><tr><th>模型</th><th>输入价格 ($/1k)</th><th>输出价格 ($/1k)</th><th>操作</th></tr></thead><tbody id="pricingTbody"></tbody></table>
</div>

<!-- Topup Modal -->
<div class="modal" id="topupModal"><div class="modal-box">
  <h3>充值</h3>
  <p style="margin-bottom:10px;font-size:13px;">用户: <strong id="topupEmail"></strong> &nbsp; 当前余额: <strong id="topupBalance"></strong></p>
  <input type="number" id="topupAmount" placeholder="充值金额" min="1" step="1" onkeydown="if(event.key==='Enter')doTopup()">
  <div class="actions">
    <button class="btn-primary" onclick="doTopup()">确认充值</button>
    <button onclick="closeModal('topupModal')">取消</button>
  </div>
</div></div>

<!-- Route Edit Modal -->
<div class="modal" id="routeModal"><div class="modal-box">
  <h3>编辑路由</h3>
  <input type="text" id="routeAlias" disabled style="opacity:0.5;">
  <input type="text" id="routeProvider" placeholder="上游供应商 (deepseek/qwen)">
  <input type="text" id="routeUpstream" placeholder="上游模型名">
  <select id="routeFormat"><option value="openai">OpenAI</option><option value="anthropic">Anthropic</option></select>
  <select id="routeActive"><option value="true">启用</option><option value="false">禁用</option></select>
  <div class="actions">
    <button class="btn-primary" onclick="saveRoute()">保存</button>
    <button onclick="closeModal('routeModal')">取消</button>
  </div>
</div></div>

<!-- Pricing Edit Modal -->
<div class="modal" id="pricingModal"><div class="modal-box">
  <h3>编辑定价</h3>
  <input type="text" id="pricingModel" disabled style="opacity:0.5;">
  <input type="number" id="pricingInput" placeholder="输入价格 ($/1k tokens)" step="0.001" min="0">
  <input type="number" id="pricingOutput" placeholder="输出价格 ($/1k tokens)" step="0.001" min="0">
  <div class="actions">
    <button class="btn-primary" onclick="savePricing()">保存</button>
    <button onclick="closeModal('pricingModal')">取消</button>
  </div>
</div></div>

<div class="toast" id="toast"></div>

<script>
let currentTab = 'overview';
let topupUserId = null;

// --- Auth check ---
async function checkAuth() {
  const res = await fetch('/admin/users');
  if (res.status === 401) { window.location.href = '/static/admin-login.html'; return false; }
  return true;
}

// --- Navigation ---
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('nav a[data-tab]').forEach(a => a.classList.toggle('active', a.dataset.tab === tab));
  document.querySelectorAll('[id^="tab-"]').forEach(d => d.style.display = d.id === 'tab-' + tab ? 'block' : 'none');
  if (tab === 'overview') loadStats();
  if (tab === 'users') loadUsers();
  if (tab === 'routes') loadRoutes();
  if (tab === 'pricing') loadPricing();
}

// --- Stats ---
async function loadStats() {
  const res = await fetch('/admin/stats');
  const stats = await res.json();
  document.getElementById('statsCards').innerHTML = `
    <div class="stat"><div class="label">总用户数</div><div class="value">${stats.total_users}</div></div>
    <div class="stat"><div class="label">今日调用</div><div class="value">${stats.today_calls}</div></div>
    <div class="stat"><div class="label">总充值金额</div><div class="value">¥${stats.total_topup.toFixed(2)}</div></div>
  `;
}

// --- Users ---
async function loadUsers() {
  const res = await fetch('/admin/users');
  const users = await res.json();
  const tbody = document.getElementById('usersTbody');
  if (!users.length) { tbody.innerHTML = '<tr><td colspan="6" class="empty">暂无用户</td></tr>'; return; }
  tbody.innerHTML = users.map(u => `
    <tr>
      <td>${u.id}</td>
      <td>${u.email}</td>
      <td>¥${u.balance.toFixed(2)}</td>
      <td><span class="tag ${u.is_active ? 'tag-active' : 'tag-banned'}">${u.is_active ? '正常' : '已封禁'}</span></td>
      <td style="color:#6c7086;">${u.created_at.slice(0,10)}</td>
      <td>
        <button class="btn-warn btn-sm" onclick="openTopup(${u.id}, '${u.email}', ${u.balance})">充值</button>
        <button class="${u.is_active ? 'btn-danger' : 'btn-primary'} btn-sm" onclick="toggleBan(${u.id})">${u.is_active ? '封禁' : '解封'}</button>
      </td>
    </tr>
  `).join('');
}

// --- Topup ---
function openTopup(id, email, balance) {
  topupUserId = id;
  document.getElementById('topupEmail').textContent = email;
  document.getElementById('topupBalance').textContent = '¥' + balance.toFixed(2);
  document.getElementById('topupAmount').value = '';
  openModal('topupModal');
}
async function doTopup() {
  const amount = parseFloat(document.getElementById('topupAmount').value);
  if (!amount || amount <= 0) return;
  const res = await fetch('/admin/users/' + topupUserId + '/topup', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({amount}) });
  if (res.ok) { closeModal('topupModal'); loadUsers(); toast('充值成功'); }
}
async function toggleBan(id) {
  const res = await fetch('/admin/users/' + id + '/ban', { method: 'POST' });
  if (res.ok) { loadUsers(); }
}

// --- Routes ---
async function loadRoutes() {
  const res = await fetch('/admin/routes');
  const routes = await res.json();
  document.getElementById('routesTbody').innerHTML = routes.map(r => `
    <tr>
      <td style="font-weight:600;">${r.alias}</td>
      <td>${r.upstream_provider}</td>
      <td style="font-family:monospace;color:#f9e2af;">${r.upstream_model}</td>
      <td><span class="tag ${r.api_format === 'openai' ? 'tag-openai' : 'tag-anthropic'}">${r.api_format}</span></td>
      <td><span class="tag ${r.is_active ? 'tag-active' : 'tag-banned'}">${r.is_active ? '启用' : '禁用'}</span></td>
      <td><button class="btn-primary btn-sm" onclick="openRouteEdit('${r.alias}', '${r.upstream_provider}', '${r.upstream_model}', '${r.api_format}', ${r.is_active})">编辑</button></td>
    </tr>
  `).join('');
}
function openRouteEdit(alias, provider, upstream, format, active) {
  document.getElementById('routeAlias').value = alias;
  document.getElementById('routeProvider').value = provider;
  document.getElementById('routeUpstream').value = upstream;
  document.getElementById('routeFormat').value = format;
  document.getElementById('routeActive').value = active ? 'true' : 'false';
  openModal('routeModal');
}
async function saveRoute() {
  const alias = document.getElementById('routeAlias').value;
  const body = {
    upstream_provider: document.getElementById('routeProvider').value,
    upstream_model: document.getElementById('routeUpstream').value,
    api_format: document.getElementById('routeFormat').value,
    is_active: document.getElementById('routeActive').value === 'true',
  };
  const res = await fetch('/admin/routes/' + encodeURIComponent(alias), { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if (res.ok) { closeModal('routeModal'); loadRoutes(); toast('路由已更新'); }
}

// --- Pricing ---
async function loadPricing() {
  const res = await fetch('/api/pricing');
  const prices = await res.json();
  document.getElementById('pricingTbody').innerHTML = prices.map(p => `
    <tr>
      <td style="font-weight:600;">${p.model}</td>
      <td>$${p.input_price_per_1k.toFixed(4)}</td>
      <td>$${p.output_price_per_1k.toFixed(4)}</td>
      <td><button class="btn-primary btn-sm" onclick="openPricingEdit('${p.model}', ${p.input_price_per_1k}, ${p.output_price_per_1k})">编辑</button></td>
    </tr>
  `).join('');
}
function openPricingEdit(model, inp, out) {
  document.getElementById('pricingModel').value = model;
  document.getElementById('pricingInput').value = inp;
  document.getElementById('pricingOutput').value = out;
  openModal('pricingModal');
}
async function savePricing() {
  const model = document.getElementById('pricingModel').value;
  const body = {
    price_per_1k_input: parseFloat(document.getElementById('pricingInput').value),
    price_per_1k_output: parseFloat(document.getElementById('pricingOutput').value),
  };
  const res = await fetch('/admin/pricing/' + encodeURIComponent(model), { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if (res.ok) { closeModal('pricingModal'); loadPricing(); toast('定价已更新'); }
}

// --- Modal ---
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

// --- Toast ---
function toast(msg, err) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast ' + (err ? 'err' : '') + ' show';
  setTimeout(() => t.classList.remove('show'), 2000);
}

// --- Logout ---
async function logout() { await fetch('/admin/logout', {method:'POST'}); window.location.href = '/static/admin-login.html'; }

// --- Init ---
if (checkAuth()) loadStats();

// Click outside modal to close
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); }));
</script>
</body>
</html>
