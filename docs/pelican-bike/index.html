<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #1d2433; font-family: "Microsoft YaHei", system-ui, sans-serif; color: #eef;
    gap: 16px; padding: 16px;
  }
  h1 { font-size: 22px; letter-spacing: 2px; font-weight: 600; }
  #stage {
    width: min(1000px, 96vw); aspect-ratio: 5 / 3;
    border-radius: 16px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.45);
    cursor: pointer; user-select: none;
  }
  svg { width: 100%; height: 100%; display: block; }
  .controls { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; justify-content: center; }
  button {
    background: #f39c3d; color: #1d2433; border: 0; border-radius: 8px;
    padding: 8px 18px; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  label { display: flex; gap: 8px; align-items: center; font-size: 14px; }
  input[type=range] { width: 180px; accent-color: #f39c3d; }
  .tip { font-size: 13px; opacity: .6; }
</style>
</head>
<body>
<h1>🚲 鹈鹕骑自行车</h1>

<div id="stage">
<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f2"/>
      <stop offset="0.7" stop-color="#cdeefc"/>
      <stop offset="1" stop-color="#fff4d6"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#fff7b0"/>
      <stop offset="0.5" stop-color="#ffe066" stop-opacity=".6"/>
      <stop offset="1" stop-color="#ffe066" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe3ea"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb25b"/>
      <stop offset="1" stop-color="#f06c3b"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6170"/>
      <stop offset="1" stop-color="#3d414c"/>
    </linearGradient>
  </defs>

  <!-- 天空 & 太阳 -->
  <rect width="1000" height="600" fill="url(#sky)"/>
  <circle cx="820" cy="110" r="110" fill="url(#sunGlow)"/>
  <circle cx="820" cy="110" r="46" fill="#ffd84d"/>

  <!-- 视差图层（由 JS 填充并滚动） -->
  <g id="layerClouds"></g>
  <g id="layerMountains"></g>
  <g id="layerHills"></g>
  <g id="layerTrees"></g>

  <!-- 地面 -->
  <rect x="0" y="455" width="1000" height="145" fill="#7cc36a"/>
  <rect x="0" y="462" width="1000" height="70" fill="url(#road)"/>
  <rect x="0" y="462" width="1000" height="4" fill="#9aa0ab"/>
  <g id="layerRoad"></g>

  <!-- 影子 -->
  <ellipse id="shadow" cx="480" cy="498" rx="150" ry="9" fill="#000" opacity=".22"/>

  <!-- 尘土粒子 -->
  <g id="dust"></g>

  <!-- 自行车 + 鹈鹕，原点 = 五通(中轴) -->
  <g id="rider" transform="translate(480 424)">
    <g id="bounce">

      <!-- 远侧腿 -->
      <g id="farLeg" opacity=".75">
        <path id="farThigh" stroke="#d9dde4" stroke-width="16" stroke-linecap="round" fill="none"/>
        <path id="farShin" stroke="#e0863a" stroke-width="7" stroke-linecap="round" fill="none"/>
        <path id="farFoot" fill="#e0863a"/>
      </g>
      <!-- 远侧曲柄 -->
      <line id="farCrank" stroke="#555" stroke-width="6" stroke-linecap="round"/>
      <rect id="farPedal" width="18" height="6" rx="2" fill="#444"/>

      <!-- 车轮 -->
      <g id="wheelR"></g>
      <g id="wheelF"></g>

      <!-- 链条 -->
      <path d="M -110 -8 L 0 -15 M -110 8 L 0 15" stroke="#333" stroke-width="3" stroke-dasharray="3 2" id="chain"/>
      <circle cx="-110" cy="0" r="8" fill="#888" stroke="#333" stroke-width="2"/>

      <!-- 车架 -->
      <g stroke="#e8423f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M -110 0 L 0 0 L -32 -82 Z"/>          <!-- 后下叉/后上叉/立管 -->
        <path d="M -32 -82 L 74 -88 L 0 0"/>            <!-- 上管/下管 -->
        <path d="M 74 -88 L 110 0"/>                    <!-- 前叉 -->
      </g>
      <path d="M 70 -100 L 78 -78" stroke="#b72e2c" stroke-width="10" stroke-linecap="round"/>
      <!-- 座杆 + 车座 -->
      <path d="M -32 -82 L -38 -100" stroke="#999" stroke-width="5"/>
      <path d="M -62 -103 Q -40 -110 -18 -104 Q -30 -96 -60 -98 Z" fill="#2b2b2b"/>
      <!-- 车把 -->
      <path d="M 70 -100 L 82 -118 Q 92 -122 96 -114" stroke="#666" stroke-width="5" fill="none" stroke-linecap="round"/>
      <circle cx="96" cy="-113" r="5" fill="#2b2b2b"/>
      <!-- 车铃 -->
      <circle id="bell" cx="84" cy="-124" r="5" fill="#f6c945" stroke="#b58d1d" stroke-width="1.5"/>

      <!-- 牙盘 -->
      <g id="chainring">
        <circle r="16" fill="none" stroke="#666" stroke-width="4"/>
        <circle r="5" fill="#444"/>
        <path d="M 0 -16 L 0 16 M -16 0 L 16 0" stroke="#666" stroke-width="2"/>
      </g>

      <!-- 鹈鹕 -->
      <g id="pelican">
        <!-- 尾巴 -->
        <path d="M -78 -150 L -110 -162 L -104 -148 L -114 -140 L -80 -134 Z" fill="#c9ced8" stroke="#8b93a3" stroke-width="1.5"/>
        <!-- 身体 -->
        <ellipse cx="-25" cy="-140" rx="60" ry="37" transform="rotate(-14 -25 -140)" fill="url(#bodyGrad)" stroke="#8b93a3" stroke-width="2"/>
        <!-- 围巾后摆 -->
        <path id="scarfTail" fill="#e8423f" stroke="#a82b28" stroke-width="1.5"/>
        <!-- 脖子 -->
        <path d="M 8 -152 C 32 -172 18 -200 44 -218" stroke="#8b93a3" stroke-width="25" stroke-linecap="round" fill="none"/>
        <path d="M 8 -152 C 32 -172 18 -200 44 -218" stroke="#fff" stroke-width="21" stroke-linecap="round" fill="none"/>
        <!-- 围巾 -->
        <path d="M 2 -168 Q 22 -160 36 -176 L 38 -166 Q 22 -150 2 -158 Z" fill="#e8423f" stroke="#a82b28" stroke-width="1.5"/>

        <!-- 头部（可点头） -->
        <g id="head">
          <circle cx="46" cy="-222" r="20" fill="#fff" stroke="#8b93a3" stroke-width="2"/>
          <!-- 头顶羽冠 -->
          <path d="M 34 -238 Q 22 -256 12 -250 Q 26 -246 30 -236 Z" fill="#f6e7a8" stroke="#c9b25a" stroke-width="1"/>
          <path d="M 40 -241 Q 36 -262 24 -262 Q 36 -252 36 -240 Z" fill="#f6e7a8" stroke="#c9b25a" stroke-width="1"/>
          <!-- 眼睛 -->
          <circle cx="52" cy="-226" r="6" fill="#fff" stroke="#555" stroke-width="1.2"/>
          <circle id="pupil" cx="54" cy="-226" r="3" fill="#1d2433"/>
          <circle cx="55" cy="-227.5" r="1" fill="#fff"/>
          <path id="lid" d="M 45 -232 Q 52 -236 59 -232" stroke="#8b93a3" stroke-width="1.5" fill="none"/>
          <!-- 下喙 + 喉囊（可张开） -->
          <g id="jaw">
            <path id="pouch" d="M 58 -214 Q 100 -206 146 -203 Q 108 -170 74 -182 Q 56 -192 58 -214 Z" fill="url(#pouchGrad)" stroke="#b9502a" stroke-width="1.5"/>
          </g>
          <!-- 上喙 -->
          <path d="M 56 -230 Q 100 -224 150 -207 Q 150 -202 144 -202 Q 100 -212 58 -214 Z" fill="#ffc15e" stroke="#b9702a" stroke-width="1.5"/>
          <path d="M 145 -206 q 6 2 4 7 q -4 -1 -5 -4 z" fill="#e05a2a"/>
        </g>

        <!-- 翅膀（握车把） -->
        <path d="M -62 -158 C -20 -178 40 -150 92 -118 L 88 -108 C 50 -126 0 -126 -60 -128 Z" fill="#eef0f4" stroke="#8b93a3" stroke-width="2"/>
        <path d="M 60 -128 C 72 -124 82 -118 92 -118 L 88 -108 C 80 -114 70 -118 58 -120 Z" fill="#3a3f4b"/>
        <path d="M -40 -148 Q 0 -150 40 -136 M -44 -138 Q 0 -140 30 -130" stroke="#b8bfcb" stroke-width="1.5" fill="none"/>
      </g>

      <!-- 近侧曲柄 -->
      <line id="nearCrank" stroke="#777" stroke-width="6" stroke-linecap="round"/>
      <rect id="nearPedal" width="18" height="6" rx="2" fill="#555"/>
      <!-- 近侧腿 -->
      <g id="nearLeg">
        <path id="nearThigh" stroke="#fff" stroke-width="18" stroke-linecap="round" fill="none"/>
        <path id="nearShin" stroke="#f39c3d" stroke-width="7" stroke-linecap="round" fill="none"/>
        <path id="nearFoot" fill="#f39c3d" stroke="#c46e1f" stroke-width="1"/>
      </g>
    </g>

    <!-- 说话气泡 -->
    <g id="bubble" opacity="0">
      <path d="M 150 -300 h 110 a 16 16 0 0 1 16 16 v 34 a 16 16 0 0 1 -16 16 h -80 l -24 18 l 4 -18 h -10 a 16 16 0 0 1 -16 -16 v -34 a 16 16 0 0 1 16 -16 z" fill="#fff" stroke="#333" stroke-width="2"/>
      <text id="bubbleText" x="205" y="-258" text-anchor="middle" font-size="26" font-weight="700" fill="#e8423f">嘎！</text>
    </g>
  </g>
</svg>
</div>

<div class="controls">
  <button id="toggle">⏸ 暂停</button>
  <label>速度 <input id="speed" type="range" min="0" max="3" step="0.05" value="1"><span id="speedVal">1.0x</span></label>
  <button id="ring">🔔 按铃</button>
</div>
<div class="tip">点击画面让鹈鹕叫一声</div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const el = (tag, attrs, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
};

// ---------- 场景构建 ----------
const W = 1000;

// 可无缝平铺的图层：内容画在 [0, W)，再复制一份到 [W, 2W)
function tileLayer(layer, build) {
  const inner = el('g', {}, layer);
  const a = el('g', {}, inner); build(a);
  const b = el('g', { transform: `translate(${W} 0)` }, inner); build(b);
  return inner;
}

// 周期性山脊线
function ridge(baseY, amps, bottom) {
  let d = `M 0 ${bottom}`;
  for (let x = 0; x <= W; x += 10) {
    let y = baseY;
    amps.forEach(([amp, k, ph]) => y -= amp * Math.sin((x / W) * Math.PI * 2 * k + ph));
    d += ` L ${x} ${y.toFixed(1)}`;
  }
  return d + ` L ${W} ${bottom} Z`;
}

const layers = [];

// 云
layers.push({ speed: 0.08, g: tileLayer($('layerClouds'), g => {
  [[80, 90, 1], [360, 60, .7], [620, 130, 1.2], [880, 70, .8]].forEach(([x, y, s]) => {
    const c = el('g', { transform: `translate(${x} ${y}) scale(${s})`, fill: '#fff', opacity: .9 }, g);
    el('ellipse', { cx: 0, cy: 0, rx: 50, ry: 20 }, c);
    el('circle', { cx: -18, cy: -12, r: 22 }, c);
    el('circle', { cx: 16, cy: -18, r: 28 }, c);
  });
})});

// 远山
layers.push({ speed: 0.18, g: tileLayer($('layerMountains'), g => {
  el('path', { d: ridge(300, [[60, 2, 0], [30, 5, 1], [12, 11, 2]], 470), fill: '#9fb7d8' }, g);
})});

// 丘陵
layers.push({ speed: 0.4, g: tileLayer($('layerHills'), g => {
  el('path', { d: ridge(390, [[30, 3, 2], [14, 7, 0.5]], 470), fill: '#8fd07a' }, g);
})});

// 树 + 栅栏
layers.push({ speed: 0.75, g: tileLayer($('layerTrees'), g => {
  for (let x = 0; x < W; x += 50) {
    el('rect', { x: x, y: 425, width: 6, height: 34, fill: '#b48a5a' }, g);
  }
  el('rect', { x: 0, y: 432, width: W, height: 5, fill: '#c9a06e' }, g);
  el('rect', { x: 0, y: 446, width: W, height: 5, fill: '#c9a06e' }, g);
  [[70, 1], [310, .8], [540, 1.15], [800, .9]].forEach(([x, s]) => {
    const t = el('g', { transform: `translate(${x} 455) scale(${s})` }, g);
    el('rect', { x: -6, y: -60, width: 12, height: 60, fill: '#8a5a33' }, t);
    el('circle', { cx: 0, cy: -80, r: 34, fill: '#4fa35a' }, t);
    el('circle', { cx: -20, cy: -64, r: 22, fill: '#46984f' }, t);
    el('circle', { cx: 20, cy: -66, r: 24, fill: '#5bb266' }, t);
  });
})});

// 路面虚线
layers.push({ speed: 1, g: tileLayer($('layerRoad'), g => {
  for (let x = 0; x < W; x += 100) el('rect', { x: x, y: 510, width: 50, height: 5, rx: 2, fill: '#f4f1e0' }, g);
  for (let x = 25; x < W; x += 125) {
    el('path', { d: `M ${x} 560 l 4 -12 l 4 12 m 2 0 l 4 -9 l 3 9`, stroke: '#4d9b44', 'stroke-width': 2, fill: 'none' }, g);
  }
})});

// 车轮
const WHEEL_R = 60;
function buildWheel(g, cx) {
  el('circle', { cx, cy: 0, r: WHEEL_R, fill: 'none', stroke: '#2b2b2b', 'stroke-width': 9 }, g);
  el('circle', { cx, cy: 0, r: WHEEL_R - 6, fill: 'none', stroke: '#b9bec8', 'stroke-width': 2.5 }, g);
  const spokes = el('g', {}, g);
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * Math.PI * 2;
    el('line', { x1: cx, y1: 0, x2: cx + Math.cos(a) * (WHEEL_R - 6), y2: Math.sin(a) * (WHEEL_R - 6), stroke: '#c7ccd4', 'stroke-width': 1.2 }, spokes);
  }
  // 气门芯/反光片，让转动更明显
  el('rect', { x: cx - 4, y: -WHEEL_R + 14, width: 8, height: 14, rx: 2, fill: '#ff8a3d' }, spokes);
  el('circle', { cx, cy: 0, r: 6, fill: '#666' }, g);
  return spokes;
}
const spokesR = buildWheel($('wheelR'), -110);
const spokesF = buildWheel($('wheelF'), 110);

// ---------- 骑行动力学 ----------
const HIP = { x: -36, y: -110 };
const THIGH = 70, SHIN = 70, CRANK = 24;

function ik(hip, foot) {
  const dx = foot.x - hip.x, dy = foot.y - hip.y;
  let d = Math.hypot(dx, dy);
  d = Math.min(Math.max(d, Math.abs(THIGH - SHIN) + 1), THIGH + SHIN - 0.5);
  const base = Math.atan2(dy, dx);
  const off = Math.acos((THIGH * THIGH + d * d - SHIN * SHIN) / (2 * THIGH * d));
  const a = base - off; // 膝盖朝前
  return { x: hip.x + Math.cos(a) * THIGH, y: hip.y + Math.sin(a) * THIGH };
}

function setLeg(prefix, crankAngle, hipOffset) {
  const p = { x: Math.cos(crankAngle) * CRANK, y: Math.sin(crankAngle) * CRANK };
  const hip = { x: HIP.x + hipOffset, y: HIP.y };
  const knee = ik(hip, p);
  $(prefix + 'Crank').setAttribute('x1', 0); $(prefix + 'Crank').setAttribute('y1', 0);
  $(prefix + 'Crank').setAttribute('x2', p.x); $(prefix + 'Crank').setAttribute('y2', p.y);
  $(prefix + 'Pedal').setAttribute('x', p.x - 9); $(prefix + 'Pedal').setAttribute('y', p.y - 3);
  $(prefix + 'Thigh').setAttribute('d', `M ${hip.x} ${hip.y} L ${knee.x} ${knee.y}`);
  $(prefix + 'Shin').setAttribute('d', `M ${knee.x} ${knee.y} L ${p.x} ${p.y - 3}`);
  // 蹼足：三趾扇形
  const fx = p.x, fy = p.y - 4;
  $(prefix + 'Foot').setAttribute('d',
    `M ${fx - 6} ${fy} L ${fx + 16} ${fy - 3} L ${fx + 13} ${fy + 1} L ${fx + 18} ${fy + 3} L ${fx + 12} ${fy + 5} L ${fx - 6} ${fy + 3} Z`);
}

// 尘土
const dustG = $('dust');
const particles = [];
function spawnDust(speed) {
  if (speed < 0.3 || Math.random() > 0.25 * speed) return;
  const c = el('circle', { r: 3 + Math.random() * 4, fill: '#c9b89a' }, dustG);
  particles.push({ el: c, x: 370 + Math.random() * 10, y: 490 - Math.random() * 6, vx: -1.5 - Math.random() * 2 * speed, vy: -0.4 - Math.random() * 0.6, life: 1 });
}
function updateDust(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.vy += 0.02 * dt * 60; p.life -= dt * 1.4;
    if (p.life <= 0) { p.el.remove(); particles.splice(i, 1); continue; }
    p.el.setAttribute('cx', p.x); p.el.setAttribute('cy', p.y);
    p.el.setAttribute('opacity', (p.life * 0.6).toFixed(2));
  }
}

// ---------- 主循环 ----------
let playing = true, speedMul = 1;
let distance = 0, t = 0, last = performance.now();
let squawkUntil = 0;
const BASE_SPEED = 220; // 像素/秒
const GEAR = 2.2;       // 车轮转一圈 = 曲柄转 1/GEAR 圈

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (playing) {
    t += dt;
    distance += BASE_SPEED * speedMul * dt;
  }
  const wheelAngle = distance / WHEEL_R;          // 弧度
  const crank = wheelAngle / GEAR;

  // 视差滚动
  layers.forEach(L => {
    const off = (distance * L.speed) % W;
    L.g.setAttribute('transform', `translate(${-off} 0)`);
  });

  // 车轮/牙盘
  const deg = wheelAngle * 180 / Math.PI;
  spokesR.setAttribute('transform', `rotate(${deg} -110 0)`);
  spokesF.setAttribute('transform', `rotate(${deg} 110 0)`);
  $('chainring').setAttribute('transform', `rotate(${crank * 180 / Math.PI})`);
  $('chain').setAttribute('stroke-dashoffset', (-distance * 0.3) % 5);

  // 腿
  setLeg('near', crank, 0);
  setLeg('far', crank + Math.PI, -4);

  // 身体起伏 & 点头
  const bob = Math.sin(crank * 2) * 2 * Math.min(speedMul, 1.5);
  $('bounce').setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);
  $('pelican').setAttribute('transform', `rotate(${(Math.sin(crank * 2) * 1.2).toFixed(2)} -30 -110)`);
  const nod = Math.sin(crank * 2 + 0.8) * 3 - speedMul * 1.5;
  $('head').setAttribute('transform', `rotate(${nod.toFixed(2)} 30 -205)`);
  $('shadow').setAttribute('rx', 150 - bob * 2);

  // 围巾飘动
  const w = t * 10 * (0.4 + speedMul);
  const len = 40 + 30 * Math.min(speedMul, 2);
  let top = 'M 4 -166', bot = '';
  const ptsTop = [], ptsBot = [];
  for (let i = 1; i <= 5; i++) {
    const x = 4 - i * len / 5;
    const y = -166 + i * 3 + Math.sin(w - i * 0.9) * i * 1.8;
    ptsTop.push(`${x.toFixed(1)} ${y.toFixed(1)}`);
    ptsBot.unshift(`${x.toFixed(1)} ${(y + 10 - i * 0.8).toFixed(1)}`);
  }
  $('scarfTail').setAttribute('d', `${top} L ${ptsTop.join(' L ')} L ${ptsBot.join(' L ')} L 4 -154 Z`);

  // 眨眼
  const blink = (t % 3.7) < 0.12;
  $('lid').setAttribute('d', blink ? 'M 45 -226 Q 52 -224 59 -226' : 'M 45 -232 Q 52 -236 59 -232');
  $('pupil').setAttribute('opacity', blink ? 0 : 1);

  // 叫声：张嘴 + 气泡
  const sq = now < squawkUntil;
  const open = sq ? 14 + Math.sin(now / 40) * 4 : 0;
  $('jaw').setAttribute('transform', `rotate(${open} 58 -214)`);
  $('bubble').setAttribute('opacity', sq ? 1 : 0);

  if (playing) spawnDust(speedMul);
  updateDust(playing ? dt : 0);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- 交互 ----------
$('toggle').onclick = () => {
  playing = !playing;
  $('toggle').textContent = playing ? '⏸ 暂停' : '▶ 播放';
};
$('speed').oninput = e => {
  speedMul = +e.target.value;
  $('speedVal').textContent = speedMul.toFixed(1) + 'x';
};

let audio;
function beep(freqs, dur) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach(([f, start, type]) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type || 'sine'; o.frequency.value = f;
      const t0 = audio.currentTime + start;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g).connect(audio.destination);
      o.start(t0); o.stop(t0 + dur);
    });
  } catch (_) {}
}

function squawk(text) {
  $('bubbleText').textContent = text;
  squawkUntil = performance.now() + 900;
}
$('stage').onclick = () => {
  squawk(['嘎！', '嘎嘎！', '让让～', '冲鸭！'][Math.floor(Math.random() * 4)]);
  beep([[320, 0, 'sawtooth'], [260, 0.12, 'sawtooth']], 0.2);
};
$('ring').onclick = () => {
  squawk('叮铃铃～');
  beep([[2100, 0], [2600, 0], [2100, 0.18], [2600, 0.18]], 0.35);
