services:
  postgres:
    image: postgres:16-alpine
    container_name: xwh-postgres
    environment:
      POSTGRES_USER: platform_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password}
      POSTGRES_DB: xwh
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    restart: always

  redis:
    image: redis:7-alpine
    container_name: xwh-redis
    ports:
      - '6379:6379'
    restart: always

volumes:
  pgdata:
